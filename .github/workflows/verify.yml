name: Verify release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository release contract
        run: node scripts/verify-release.mjs
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' archive; do
            unzip -t "$archive" >/dev/null
            count=$((count + 1))
          done < <(find assets -maxdepth 1 -type f -name '*.zip' -print0)
          test "$count" -eq 5
