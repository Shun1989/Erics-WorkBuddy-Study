<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">漂亮废话镜渊退货流程</title>
  <desc id="desc">一叠表面漂亮的答案因缺少来源验收和责任人而被镜渊退回</desc>
  <defs>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00C8FF"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F56C2D"/></marker>
    <radialGradient id="abyss"><stop offset="0" stop-color="#F56C2D" stop-opacity=".65"/><stop offset=".28" stop-color="#003A73" stop-opacity=".9"/><stop offset="1" stop-color="#001A33"/></radialGradient>
  </defs>
  <rect x="2" y="2" width="1396" height="556" rx="34" fill="#001A33" stroke="#005BAC" stroke-width="3"/>
  <g opacity=".15" stroke="#4A90D9"><path d="M0 90H1400M0 180H1400M0 270H1400M0 360H1400M0 450H1400"/><path d="M140 0V560M420 0V560M700 0V560M980 0V560M1260 0V560"/></g>
  <g transform="translate(80 145)" font-family="Microsoft YaHei, sans-serif">
    <rect x="30" y="28" width="280" height="250" rx="22" fill="#002748" stroke="#4A90D9" stroke-width="3" transform="rotate(-5 170 153)"/>
    <rect x="0" y="0" width="280" height="250" rx="22" fill="#003A73" stroke="#00C8FF" stroke-width="4"/>
    <text x="140" y="62" fill="#FFFFFF" font-size="37" font-weight="800" text-anchor="middle">漂亮废话</text>
    <text x="140" y="125" fill="#CCE5FF" font-size="26" text-anchor="middle">综上所述</text>
    <text x="140" y="170" fill="#CCE5FF" font-size="26" text-anchor="middle">全面赋能</text>
    <text x="140" y="215" fill="#CCE5FF" font-size="26" text-anchor="middle">未来可期</text>
  </g>
  <path d="M410 280H530" stroke="#00C8FF" stroke-width="8" marker-end="url(#cyanArrow)"/>
  <g transform="translate(550 145)" font-family="Microsoft YaHei, sans-serif">
    <rect width="300" height="250" rx="28" fill="#003A73" stroke="#F56C2D" stroke-width="4"/>
    <text x="150" y="60" fill="#FFFFFF" font-size="38" font-weight="800" text-anchor="middle">三证查验</text>
    <text x="150" y="122" fill="#F56C2D" font-size="28" text-anchor="middle">来源？</text>
    <text x="150" y="168" fill="#F56C2D" font-size="28" text-anchor="middle">验收？</text>
    <text x="150" y="214" fill="#F56C2D" font-size="28" text-anchor="middle">责任人？</text>
  </g>
  <path d="M870 280H990" stroke="#00C8FF" stroke-width="8" marker-end="url(#cyanArrow)"/>
  <circle cx="1160" cy="280" r="150" fill="url(#abyss)" stroke="#F56C2D" stroke-width="5" stroke-dasharray="12 10"/>
  <g fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><text x="1160" y="272" font-size="52" font-weight="800">镜渊</text><text x="1160" y="326" font-size="27" fill="#CCE5FF">不收无主答案</text></g>
  <path d="M1150 445C1020 535 390 535 260 430" fill="none" stroke="#F56C2D" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#orangeArrow)"/>
  <rect x="570" y="450" width="260" height="60" rx="30" fill="#F56C2D"/>
  <text x="700" y="490" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="800" text-anchor="middle">退回工单：请补证</text>
</svg>
