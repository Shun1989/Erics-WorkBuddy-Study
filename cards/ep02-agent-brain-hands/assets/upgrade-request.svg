<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">小序升级申请</title><desc id="d">回答能力增加计划工具和反馈后成为能执行多步任务的智能体</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00C8FF"/></marker></defs><rect x="2" y="2" width="1396" height="556" rx="34" fill="#001A33" stroke="#005BAC" stroke-width="3"/><g opacity=".16" stroke="#00C8FF"><path d="M0 90H1400M0 180H1400M0 270H1400M0 360H1400M0 450H1400"/><path d="M140 0V560M420 0V560M700 0V560M980 0V560M1260 0V560"/></g><rect x="85" y="85" width="1230" height="390" rx="28" fill="#003A73" fill-opacity=".72" stroke="#4A90D9" stroke-width="4"/><text x="125" y="145" fill="#CCE5FF" font-family="Microsoft YaHei" font-size="30">百工院升级单 · 纸甲机灵“小序”</text><rect x="1060" y="105" width="210" height="58" rx="29" fill="#F56C2D"/><text x="1165" y="143" fill="white" font-family="Microsoft YaHei" font-size="26" font-weight="800" text-anchor="middle">权限待审批</text><g font-family="Microsoft YaHei" text-anchor="middle"><rect x="130" y="225" width="260" height="150" rx="24" fill="#002748" stroke="#4A90D9" stroke-width="4"/><text x="260" y="286" fill="white" font-size="39" font-weight="800">回答</text><text x="260" y="336" fill="#CCE5FF" font-size="25">知道怎么说</text><path d="M410 300H490" stroke="#00C8FF" stroke-width="8" marker-end="url(#a)"/><rect x="520" y="205" width="230" height="190" rx="24" fill="#003A73" stroke="#00C8FF" stroke-width="4"/><text x="635" y="270" fill="white" font-size="38" font-weight="800">计划</text><text x="635" y="322" fill="#CCE5FF" font-size="25">知道先做什么</text><rect x="790" y="205" width="230" height="190" rx="24" fill="#003A73" stroke="#00C8FF" stroke-width="4"/><text x="905" y="270" fill="white" font-size="38" font-weight="800">工具</text><text x="905" y="322" fill="#CCE5FF" font-size="25">能够动手</text><rect x="1060" y="205" width="230" height="190" rx="24" fill="#003A