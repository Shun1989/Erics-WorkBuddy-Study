<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">权限分级闸门</title><desc id="d">读取可以按任务授权，写入需要确认，删除默认关闭</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00C8FF"/></marker></defs><rect x="2" y="2" width="1396" height="556" rx="34" fill="#001A33" stroke="#005BAC" stroke-width="3"/><g opacity=".15" stroke="#4A90D9"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400"/><path d="M140 0V560M420 0V560M700 0V560M980 0V560M1260 0V560"/></g><g font-family="Microsoft YaHei" text-anchor="middle"><rect x="70" y="155" width="330" height="250" rx="30" fill="#003A73" stroke="#00C8FF" stroke-width="5"/><text x="235" y="235" fill="white" font-size="45" font-weight="800">读取</text><text x="235" y="300" fill="#CCE5FF" font-size="27">限定范围后可执行</text><text x="235" y="350" fill="#00C8FF" font-size="27" font-weight="800">按任务授权</text><rect x="535" y="155" width="330" height="250" rx="30" fill="#003A73" stroke="#F56C2D" stroke-width="5"/><text x="700" y="235" fill="white" font-size="45" font-weight="800">写入</text><text x="700" y="300" fill="#CCE5FF" font-size="27">可能改变外部状态</text><text x="700" y="350" fill="#F56C2D" font-size="27" font-weight="800">执行前确认</text><rect x="1000" y="155" width="330" height="250" rx="30" fill="#002748" stroke="#F56C2D" stroke-width="5" stroke-dasharray="12 10"/><text x="1165" y="235" fill="white" font-size="45" font-weight="800">删除</text><text x="1165" y="300" fill="#CCE5FF" font-size="27">难恢复或不可逆</text><text x="1165" y="350" fill="#F56C2D" font-size="27" font-weight="800">默认关闭</text></g><path d="M410 280H515M875 280H980" stroke="#00C8FF" stroke-width="8" marker-end="url(#a)"/><rect x="490" y="55" width="420" height="66" rx="33" fill="#F56C2D"/><text x="700" y="98" fill="white" font-family="Microsoft YaHei" font-size="28" font-weight="800" text-anchor="middle">总钥匙申请：已驳回</text></