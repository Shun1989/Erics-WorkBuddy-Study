<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">数据安检三通道</title><desc id="d">公开和合成数据可用，可识别数据先脱敏，凭证和受限资料禁止输入</desc><rect x="2" y="2" width="1396" height="556" rx="34" fill="#001A33" stroke="#005BAC" stroke-width="3"/><g opacity=".15" stroke="#4A90D9"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400"/><path d="M140 0V560M420 0V560M700 0V560M980 0V560M1260 0V560"/></g><g font-family="Microsoft YaHei" text-anchor="middle"><rect x="55" y="135" width="390" height="300" rx="32" fill="#003A73" stroke="#00C8FF" stroke-width="5"/><text x="250" y="220" fill="white" font-size="44" font-weight="800">可直接用</text><text x="250" y="290" fill="#CCE5FF" font-size="27">公开资料</text><text x="250" y="340" fill="#CCE5FF" font-size="27">完全虚构数据</text><text x="250" y="390" fill="#00C8FF" font-size="25" font-weight="800">来源与授权已确认</text><rect x="505" y="135" width="390" height="300" rx="32" fill="#003A73" stroke="#F56C2D" stroke-width="5"/><text x="700" y="220" fill="white" font-size="44" font-weight="800">先脱敏</text><text x="700" y="290" fill="#CCE5FF" font-size="27">个人标识 · 联系方式</text><text x="700" y="340" fill="#CCE5FF" font-size="27">金额 · 项目代号</text><text x="700" y="390" fill="#F56C2D" font-size="25" font-weight="800">替换后再复扫</text><rect x="955" y="135" width="390" height="300" rx="32" fill="#002748" stroke="#F56C2D" stroke-width="5" stroke-dasharray="12 10"/><text x="1150" y="220" fill="white" font-size="44" font-weight="800">禁止输入</text><text x="1150" y="290" fill="#CCE5FF" font-size="27">凭证 · 会话信息</text><text x="1150" y="340" fill="#CCE5FF" font-size="27">真实客户资料</text><text x="1150" y="390" fill="#F56C2D" font-size="25" font-weight="800">安检不通过</text></g><rect x="480" y="42" width="440" height="66" rx="33" fill="#F56C2D"/><text x="700" y="86" fill="white" font-family="Microsoft YaHei" font-size="29" font-weight="800" text-anchor="middle">镜渊安检：不包撤回</text></svg>
