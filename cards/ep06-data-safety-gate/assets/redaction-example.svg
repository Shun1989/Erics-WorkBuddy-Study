<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d"><title id="t">完全虚构数据脱敏示例</title><desc id="d">虚构记录中的姓名手机号项目代号金额和邮箱经过替换后降低可识别性</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00C8FF"/></marker></defs><rect x="2" y="2" width="1396" height="556" rx="34" fill="#001A33" stroke="#005BAC" stroke-width="3"/><g opacity=".15" stroke="#4A90D9"><path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400M0 500H1400"/><path d="M140 0V560M420 0V560M700 0V560M980 0V560M1260 0V560"/></g><g font-family="Microsoft YaHei"><rect x="55" y="80" width="520" height="400" rx="30" fill="#003A73" stroke="#F56C2D" stroke-width="4"/><text x="315" y="140" fill="white" font-size="34" font-weight="800" text-anchor="middle">虚构原始记录</text><g fill="#CCE5FF" font-size="26"><text x="105" y="210">姓名：测试学员甲</text><text x="105" y="265">手机号：130-0000-0000</text><text x="105" y="320">项目：DEMO-ALPHA</text><text x="105" y="375">金额：12,345 元</text><text x="105" y="430">邮箱：demo.user@example.invalid</text></g><rect x="825" y="80" width="520" height="400" rx="30" fill="#003A73" stroke="#00C8FF" stroke-width="4"/><text x="1085" y="140" fill="white" font-size="34" font-weight="800" text-anchor="middle">脱敏后练习记录</text><g fill="#CCE5FF" font-size="26"><text x="875" y="210">姓名：学员 A</text><text x="875" y="265">手机号：130-****-0000</text><text x="875" y="320">项目：DEMO-***</text><text x="875" y="375">金额：约 1.2 万元</text><text x="875" y="430">邮箱：d***@example.invalid</text></g></g><path d="M595 280H805" stroke="#00C8FF" stroke-width="8" marker-end="url(#a)"/><rect x="595" y="180" width="210" height="68" rx="34" fill="#F56C2D"/><text x="700" y="225" fill="white" font-family="Microsoft YaHei" font-size="28" font-weight="800" text-anchor="middle">识别 · 替换 · 复扫</text><text x="700" y="520" fill="#F56C2D" font-family="Microsoft YaHei" font-size="25" font-weight="800" text-anchor="m